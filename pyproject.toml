[project]
name = "era"
version = "0.1.0"
description = "Agent that writes cited equity research notes from SEC filings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.2.10",
    "langchain-openai==1.4.2",
    "langchain-core>=1.5.2,<2.0.0",
    "pydantic>=2.7.4,<3.0.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "voyageai>=0.3.0",
    "opik==2.2.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
era = "era.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/era"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs/**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals/tier1"]
asyncio_mode = "auto"
